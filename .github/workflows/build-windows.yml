name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: KageStream Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      # MinGW64 (et non UCRT64) : c'est l'environnement documenté dans le
      # README et dans build-windows.bat — la CI doit tester le même chemin
      # que celui indiqué aux utilisateurs.
      # Noms pacman vérifiés un par un sur packages.msys2.org : le seul écart
      # historique était PyInstaller, packagé « pyinstaller » et non
      # « python-pyinstaller ».
      - name: Installer Python, GTK 3, PyGObject et PyInstaller
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-gobject
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-pyinstaller

      - name: Construire KageStream.exe
        shell: msys2 {0}
        env:
          # Chemin CI : MSYS2 fournit déjà Python, PyGObject, GTK et
          # PyInstaller — pas de venv ni de pip à fabriquer.
          CI: "1"
        run: |
          # MSYS2 convertit les arguments commençant par « / » en chemins
          # Windows : sans cette neutralisation, « cmd.exe /D /C » arrive
          # méconnaissable et cmd ne lance jamais le script batch (étape
          # « réussie » en une seconde, sans exécutable produit).
          export MSYS2_ARG_CONV_EXCL='*'
          # Le runner Windows préinstalle un Python sans PyGObject : on force
          # celui de MSYS2 en tête du PATH.
          export PATH="/mingw64/bin:$PATH"
          # Conversion désactivée juste au-dessus : les options /D et /C
          # arrivent intactes à cmd.exe.
          cmd.exe /D /C build-windows.bat
          # Filet de sécurité : échouer ici, avec le log du script sous les
          # yeux, plutôt que sur l'étape suivante.
          test -f dist/KageStream.exe || {
            echo "::error::build-windows.bat n'a produit aucun exécutable"
            ls -la dist 2>/dev/null || true
            exit 1
          }

      - name: Vérifier le fichier produit
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/KageStream.exe")) {
            throw "dist/KageStream.exe est introuvable"
          }
          Get-Item "dist/KageStream.exe" | Format-List Name, Length, LastWriteTime
          Get-FileHash "dist/KageStream.exe" -Algorithm SHA256

      - name: Publier l’exécutable
        uses: actions/upload-artifact@v4
        with:
          name: KageStream-Windows-x86_64
          path: dist/KageStream.exe
          if-no-files-found: error
          retention-days: 30
