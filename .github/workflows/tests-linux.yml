name: Tests Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests et import GTK (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      # GTK 3 et PyGObject viennent du système : KageStream n'installe pas
      # les bibliothèques graphiques lui-même (voir README).
      # xvfb est nécessaire : plusieurs tests construisent une vraie fenêtre
      # Gtk.Window, ce qui exige un serveur d'affichage.
      - name: Installer GTK 3, PyGObject et Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            xvfb

      - name: Vérifier la syntaxe de tous les modules
        run: python3 -m compileall -q kagestream kagestream.py

      - name: Importer l'interface (GTK 3, sans affichage)
        run: |
          python3 -c "import kagestream.app; print('import kagestream.app OK')"

      - name: Tests unitaires
        run: xvfb-run -a python3 -m unittest discover -s tests -v
